version: "3"

vars:
  BINARY: captain
  BIN_DIR: .bin
  APP_NAME: captain
  REGISTRY: '{{.REGISTRY | default "docker.lab"}}'
  IMAGE: "{{.REGISTRY}}/{{.APP_NAME}}"

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build the captain binary
    vars:
      VERSION:
        sh: git describe --tags --always
      COMMIT:
        sh: git rev-parse --short HEAD
      DATE:
        sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
      DIRTY:
        sh: |
          if test -n "$(git status --porcelain)"
          then
            echo true
          else
            echo false
          fi
      LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}} -X main.dirty={{.DIRTY}}
      OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .BINARY)}}'
    cmds:
      - mkdir -p {{dir .OUTPUT}}
      # GOOS set (image:lab) means cross-compiling: there is no linux cgo
      # toolchain on a macOS host, so that binary drops the sqlite-backed AI
      # response cache — opt-in via CacheTTL/CacheDBPath, and it fails loudly
      # rather than silently when enabled.
      - '{{if .GOOS}}GOOS={{.GOOS}} GOARCH={{.GOARCH}} CGO_ENABLED=0 {{end}}go build -ldflags "{{.LDFLAGS}}" -o {{.OUTPUT}} ./cmd/captain'

  www:build:
    desc: Build the embedded Captain web UI
    dir: pkg/cli/webapp
    cmds:
      - CI=true pnpm install --frozen-lockfile
      - pnpm run build
      - touch dist/.gitkeep

  www:dev:
    desc: Start Captain with the Vite dev proxy and open the browser
    dir: pkg/cli/webapp
    cmds:
      - CI=true pnpm install --frozen-lockfile
      - cd ../../.. && go run ./cmd/captain serve --dev --open

  docs:build:
    desc: Build the Captain Astro documentation site
    dir: docs
    cmds:
      - CI=true pnpm install --frozen-lockfile
      - pnpm run build

  docs:dev:
    desc: Start the Captain Astro documentation site
    dir: docs
    cmds:
      - CI=true pnpm install --frozen-lockfile
      - pnpm run dev

  image:base:
    desc: "Build the agent sandbox base image locally as captain:latest — the FROM of Dockerfile.flanksource and the base image:lab layers onto. Slow (apt, Go, Playwright); rerun only when the Dockerfile's pinned tool versions change."
    vars:
      GOARCH: '{{.GOARCH | default "amd64"}}'
    cmds:
      # deps pulls release assets from GitHub; GITHUB_TOKEN in the environment
      # lifts the anonymous rate limit the Dockerfile's secret mount expects.
      - >-
        docker buildx build --platform linux/{{.GOARCH}} --load pkg/container/base
        -f pkg/container/base/Dockerfile
        {{if .GITHUB_TOKEN}}--secret id=GITHUB_TOKEN,env=GITHUB_TOKEN{{end}}
        -t {{.APP_NAME}}:latest

  image:lab:
    desc: "Build and push the sandbox image with the working tree's captain binary to the lab registry. Requires image:base once. Defaults REGISTRY=docker.lab; override with REGISTRY=docker.example.com."
    # The binary embeds pkg/cli/webapp/dist (serve.go), so the UI is rebuilt
    # first or the image ships a stale one.
    deps: [www:build]
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
      GOARCH: '{{.GOARCH | default "amd64"}}'
      # Supplies everything but captain itself. Built by image:base — nothing is
      # published to a registry, because .github/workflows/publish-image.yml is
      # manual-only and has never been run.
      BASE_IMAGE: '{{.BASE_IMAGE | default "captain:latest"}}'
      LAB_DIR: "{{.BIN_DIR}}/lab"
    cmds:
      - task: build
        vars:
          GOOS: linux
          GOARCH: "{{.GOARCH}}"
          OUTPUT: "{{.LAB_DIR}}/captain-linux-{{.GOARCH}}"
      # Context is the lab bin dir, not the repo root: the overlay needs one
      # binary, and a root context would upload every node_modules tree.
      - >-
        docker buildx build --platform linux/{{.GOARCH}} --push {{.LAB_DIR}}
        -f pkg/container/base/Dockerfile.lab
        --build-arg BASE_IMAGE={{.BASE_IMAGE}}
        -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:latest

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - go test -v ./...

  test:e2e:mcp:
    desc: Run the black-box MCP-to-CLI end-to-end test
    cmds:
      - go test -tags=e2e -count=1 -v -timeout=8m ./tests/e2e/mcp2cli

  test:fixtures:
    desc: Run gavel fixture tests
    deps: [build]
    cmds:
      - PATH="$PWD/.bin:$PATH" gavel fixtures pkg/cli/testdata/history_test.md

  install:
    desc: Build and install captain to the default Go bin
    vars:
      VERSION:
        sh: git describe --tags --always
      COMMIT:
        sh: git rev-parse --short HEAD
      DATE:
        sh: date -u '+%Y-%m-%dT%H:%M:%SZ'
      DIRTY:
        sh: |
          if test -n "$(git status --porcelain)"
          then
            echo true
          else
            echo false
          fi
      LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}} -X main.dirty={{.DIRTY}}
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cmd/captain

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  models:update:
    desc: Regenerate the embedded LLM model registry from models.dev + local patches
    cmds:
      - go run ./pkg/ai/internal/gen-model-registry --patches pkg/ai/internal/gen-model-registry/patches.json --output pkg/api/registry/models.json

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  all:
    desc: Run fmt, lint, test, and build
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build
