name: mission-control-multistep
description: |
  Multi-step chain: find → inspect → tail. Direct access has to issue at
  least three Bash calls; Mission Control can resolve this with one or
  two structured MCP calls.
prompt: |
  In namespace `prod`, find the pod using the most memory right now and
  show its last 50 log lines. Report the pod name, its current memory
  usage, and any clearly anomalous log entries.
baseline: direct
repeat: 3

defaults:
  timeout: 3m
  permissionMode: bypassPermissions
  noSessionPersistence: true
  model: claude-sonnet-4
  promptCaching: true

runs:
  - name: direct
    tools: [Bash]
    allowedTools:
      - Bash(kubectl *)

  - name: mission-control
    tools: [default]
    mcpConfig:
      - .mcp.json
    strictMCPConfig: true
    allowedTools:
      - mcp__mission-control__*
