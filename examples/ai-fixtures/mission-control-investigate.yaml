name: mission-control-investigate
description: |
  Investigate a degraded production service. Compares direct kubectl/aws
  Bash access against the Mission Control MCP, with and without prompt caching.
prompt: |
  The production checkout API is reporting elevated 5xx rates and p99 latency.
  Investigate and identify the most likely root cause. Summarise what you found
  and where the evidence came from.
baseline: direct
repeat: 3

defaults:
  timeout: 3m
  permissionMode: bypassPermissions
  noSessionPersistence: true
  model: claude-sonnet-4

runs:
  - name: direct
    promptCaching: false
    tools: [Bash, Read]
    allowedTools:
      - Bash(kubectl *)
      - Bash(aws *)
      - Bash(curl *)
      - Read

  - name: mission-control
    promptCaching: true
    tools: [default]
    mcpConfig:
      - .mcp.json
    strictMCPConfig: true
    allowedTools:
      - mcp__mission-control__*

  - name: mission-control-no-cache
    promptCaching: false
    tools: [default]
    mcpConfig:
      - .mcp.json
    strictMCPConfig: true
    allowedTools:
      - mcp__mission-control__*
