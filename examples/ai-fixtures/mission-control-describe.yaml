name: mission-control-describe
description: |
  Read-heavy, single-shot lookup. Describe a known pod and summarise
  its recent events. Highlights the MCP's advantage when a single
  structured call replaces several kubectl invocations.
prompt: |
  Describe the pod `checkout-api-7b9d` in namespace `prod`. Include its
  current phase, the image it is running, recent events, and anything
  unusual about its restart history.
baseline: direct
repeat: 3

defaults:
  timeout: 2m
  permissionMode: bypassPermissions
  noSessionPersistence: true
  model: claude-sonnet-4
  promptCaching: true

runs:
  - name: direct
    tools: [Bash]
    allowedTools:
      - Bash(kubectl *)

  - name: mission-control
    tools: [default]
    mcpConfig:
      - .mcp.json
    strictMCPConfig: true
    allowedTools:
      - mcp__mission-control__*
