name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: flanksource/deps@v1.0.36
        with:
          tools: |
            svu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          next=$(svu patch)
          current=$(svu current)
          if [ "$next" = "$current" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No new version to tag (current: $current)"
            exit 0
          fi
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The agent sandbox base image (pkg/container/base). Runs after goreleaser
  # because the image installs `flanksource/captain: latest` via deps — the
  # release assets for this tag must exist before the image is built, or it
  # would ship the previous release's captain binary.
  docker:
    needs: [tag, goreleaser]
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: read
      id-token: write # keyless cosign signatures
      packages: write # push to ghcr.io
    uses: flanksource/action-workflows/.github/workflows/publish-multi-platform-docker-image.yml@f8512a65d38c1ea53d5c83a4e30ee2ae56acac6f # v1.2.1
    with:
      dockerfile: pkg/container/base/Dockerfile
      context: pkg/container/base
      image_tags: |
        docker.io/flanksource/captain:${{ needs.tag.outputs.tag }}
        docker.io/flanksource/captain:latest
        ghcr.io/flanksource/captain:${{ needs.tag.outputs.tag }}
        ghcr.io/flanksource/captain:latest
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}
