name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: flanksource/deps@v1.0.42
        with:
          tools: |
            svu
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          next=$(svu patch)
          current=$(svu current)
          if [ "$next" = "$current" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No new version to tag (current: $current)"
            exit 0
          fi
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: pnpm/action-setup@v4
      - run: pnpm --dir pkg/cli/webapp install --frozen-lockfile
      - name: Build webapp
        run: |
          pnpm --dir pkg/cli/webapp build
          # Vite rewrites the tracked entrypoint with content-hashed asset names.
          # Keep the generated file in place for go:embed, but hide that one
          # expected worktree change from GoReleaser's clean-tree validation.
          git diff --exit-code -- . ':(exclude)pkg/cli/webapp/dist/index.html'
          git update-index --assume-unchanged pkg/cli/webapp/dist/index.html
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
