# Runs the release job's build on the same runner with goreleaser's snapshot mode (no tag, no
# release), printing memory, disk and the largest processes every 15s to find what the build exhausts.
name: Release build diagnostics

on:
  push:
    branches: [ci/release-build-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser-build:
    runs-on: ubuntu-latest
    steps:
      - name: Runner resources at start
        run: |
          nproc
          free -m
          df -h
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: pnpm/action-setup@v4
      - run: pnpm --dir pkg/cli/webapp install --frozen-lockfile
      - name: Build webapp
        run: |
          pnpm --dir pkg/cli/webapp build
          git checkout -- pkg/cli/webapp/dist/.gitkeep
      - name: Resources before the Go build
        run: |
          free -m
          df -h / /home/runner
          du -sh ~/go/pkg/mod ~/.cache/go-build 2>/dev/null || true
      - uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true
      - name: goreleaser build, sampling resources
        run: |
          # The log streams as it's written, so the last sample survives if the runner dies.
          (
            while true; do
              echo "=== $(date -u +%T)"
              free -m | sed -n 2,3p
              df -h / /home/runner | tail -n +2
              du -sh ~/.cache/go-build 2>/dev/null
              ps -eo rss=,pid=,args= --sort=-rss | head -6 | sed -E 's/^( *[0-9]+ +[0-9]+ ).*( -p [^ ]+).*/\1\2/' | cut -c1-160
              sleep 15
            done
          ) &
          # Compiling sqlglot-go/sqlglot peaks near 6 GB, so four targets at once exhaust the
          # runner's 16 GB; two at a time should fit.
          goreleaser build --snapshot --clean --parallelism 2
          ls -la dist
