name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Lint with Gavel
        uses: flanksource/gavel@25b5e48fb166ba33a47544606aaa3e16644fa4bb # v0.0.53
        with:
          args: lint golangci-lint
          version: v0.0.53
          artifact-name: gavel-lint-results
          comment-header: captain-gavel-lint
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"
      - run: test -z "$(gofmt -l .)"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Cache embedded PostgreSQL
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/commons-db/bin
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}
      # dbtest shares one embedded PostgreSQL server while isolating each test
      # with a leased ephemeral database.
      - name: Test with Gavel
        uses: flanksource/gavel@25b5e48fb166ba33a47544606aaa3e16644fa4bb # v0.0.53
        with:
          args: test --ignore tests/e2e
          version: v0.0.53
          artifact-name: gavel-test-results
          comment-header: captain-gavel-test
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"
        env:
          TMPDIR: ${{ runner.temp }}

  mcp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go test -tags=e2e -count=1 -v -timeout=8m ./tests/e2e/mcp2cli

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go build -o captain ./cmd/captain
      - uses: actions/upload-artifact@v4
        with:
          name: captain
          path: captain
