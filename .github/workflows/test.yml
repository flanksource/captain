name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gavel does its Go work itself, and gofmt needs only the toolchain.
      - uses: ./.github/actions/setup-go
        with:
          restore: false
      - name: Lint with Gavel
        uses: flanksource/gavel@ce8e88b2ad8b9dc62802ae4230bb086768d3d105 # v0.0.56
        with:
          args: lint golangci-lint
          version: v0.0.54
          artifact-name: gavel-lint-results
          comment-header: captain-gavel-lint
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"
      - run: test -z "$(gofmt -l .)"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        id: setup-go
      - name: Cache embedded PostgreSQL
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/commons-db/bin
          key: embedded-postgres-${{ runner.os }}-${{ runner.arch }}
      # The gitagent e2e suite drives the compiled binary. Building it here
      # rather than inside a test keeps the build out of that test's deadline:
      # a dependency bump empties the build cache, and the build then takes
      # minutes, timing out the package for reasons unrelated to the code.
      - name: Build captain for the e2e suite
        run: |
          go build -o "${{ runner.temp }}/captain" ./cmd/captain
          echo "CAPTAIN_TEST_BINARY=${{ runner.temp }}/captain" >> "$GITHUB_ENV"
      # dbtest shares one embedded PostgreSQL server while isolating each test
      # with a leased ephemeral database.
      # pkg/cli/webapp is ignored: its vitest suite needs a sibling clicky-ui
      # checkout (a link: dependency), which does not exist on CI runners.
      - name: Test with Gavel
        uses: flanksource/gavel@ce8e88b2ad8b9dc62802ae4230bb086768d3d105 # v0.0.56
        with:
          # --test-timeout is the per-package deadline (gavel defaults to 5m).
          # pkg/ai/fixture drives real agent subprocesses and exceeded it on a
          # loaded runner, and a killed suite writes no ginkgo report, so one
          # slow package was reported as three failures.
          args: test --timeout 45m --test-timeout 20m --ignore tests/e2e --ignore pkg/cli/webapp
          version: v0.0.54
          artifact-name: gavel-test-results
          comment-header: captain-gavel-test
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-error: "true"
        env:
          TMPDIR: ${{ runner.temp }}
      # Save on main only: branch caches are not visible to other branches, and
      # the key carries the commit so each main push refreshes the build cache.
      - name: Save Go cache
        if: ${{ !cancelled() && steps.setup-go.outputs.cache-key != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.setup-go.outputs.cache-key }}

  mcp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      # The suite builds both binaries with -trimpath under a 5m deadline meant
      # to catch hangs; a cold compile of cmd/captain alone can exceed it on a
      # runner, so warm the build cache with the same flags first.
      - name: Warm the e2e binary builds
        run: go build -trimpath ./cmd/captain ./tests/e2e/mcp2cli/fixture
      - run: go test -tags=e2e -count=1 -v -timeout=8m ./tests/e2e/mcp2cli

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - run: go build -o captain ./cmd/captain
      - uses: actions/upload-artifact@v4
        with:
          name: captain
          path: captain
