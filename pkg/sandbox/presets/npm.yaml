network:
  allowedDomains:
    - registry.npmjs.org
    - "*.npmjs.org"
    - registry.yarnpkg.com
filesystem:
  allowWrite:
    - node_modules
    - $HOME/.npm
baseImage: "node:{{.node}}"
dependencyDirs:
  - node_modules
env:
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
passthroughEnv:
  - NODE_PATH
  - NPM_CONFIG_PREFIX
