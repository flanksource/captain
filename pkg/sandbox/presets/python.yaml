network:
  allowedDomains:
    - pypi.org
    - files.pythonhosted.org
filesystem:
  allowWrite:
    - $HOME/.local/lib
    - $HOME/.cache/pip
dependencyDirs:
  - .venv
  - __pycache__
env:
  PYTHONDONTWRITEBYTECODE: "1"
passthroughEnv:
  - VIRTUAL_ENV
  - PYTHONPATH
  - CONDA_PREFIX
baseImage: "python:{{.python}}"
install:
  - curl -fsSL https://deb.nodesource.com/setup_{{.nodeVersion}}.x | bash - && apt-get install -y --no-install-recommends nodejs && apt-get clean && rm -rf /var/lib/apt/lists/*
