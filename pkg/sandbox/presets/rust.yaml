network:
  allowedDomains:
    - crates.io
    - static.crates.io
filesystem:
  allowWrite:
    - $HOME/.cargo
dependencyDirs:
  - target
env:
  CARGO_HTTP_CHECK_REVOKE: "false"
passthroughEnv:
  - CARGO_HOME
  - RUSTUP_HOME
baseImage: "rust:{{.rust}}"
install:
  - curl -fsSL https://deb.nodesource.com/setup_{{.nodeVersion}}.x | bash - && apt-get install -y --no-install-recommends nodejs && apt-get clean && rm -rf /var/lib/apt/lists/*
