network:
  allowedDomains:
    - proxy.golang.org
    - sum.golang.org
    - "*.golang.org"
    - storage.googleapis.com
filesystem:
  allowWrite:
    - $GOPATH
    - $GOMODCACHE
env:
  GONOSUMCHECK: "*"
  GOFLAGS: "-insecure"
  SSL_CERT_FILE: ""
  GONOSUMDB: "*"
dependencyDirs:
  - $HOME/.cache/go-build
passthroughEnv:
  - GOPATH
  - GOMODCACHE
  - GOROOT
  - GOPROXY
  - GOPRIVATE
  - GOBIN
baseImage: "golang:{{.golang}}"
install:
  - curl -fsSL https://deb.nodesource.com/setup_{{.nodeVersion}}.x | bash - && apt-get install -y --no-install-recommends nodejs && apt-get clean && rm -rf /var/lib/apt/lists/*
