# Binaries installed into the agent sandbox image via `deps` (shipped by
# flanksource/base-image).
#
# Every entry is declared explicitly rather than relying on deps' owner/repo
# heuristic: `deps install` with no arguments resolves only through the registry
# (see InstallFromConfig in flanksource/deps), and the golangci-lint release
# publishes .deb/.rpm/.tar.gz for the same platform, so a glob would be ambiguous.
registry:
  gavel:
    name: gavel
    repo: flanksource/gavel
    asset_patterns:
      linux-amd64: gavel_linux_amd64.tar.gz
      linux-arm64: gavel_linux_arm64.tar.gz
      darwin-amd64: gavel_darwin_amd64.tar.gz
      darwin-arm64: gavel_darwin_arm64.tar.gz
    checksum_file: checksums.txt
    version_command: version
    version_regex: 'gavel v?(\d+\.\d+\.\d+)'

  repomap:
    name: repomap
    repo: flanksource/repomap
    asset_patterns:
      linux-amd64: repomap-linux-amd64
      linux-arm64: repomap-linux-arm64
      darwin-amd64: repomap-darwin-amd64
      darwin-arm64: repomap-darwin-arm64
    checksum_file: checksums.txt
    version_command: version
    version_regex: 'repomap v?(\d+\.\d+\.\d+)'

  captain:
    name: captain
    repo: flanksource/captain
    asset_patterns:
      linux-amd64: captain_linux_amd64.tar.gz
      linux-arm64: captain_linux_arm64.tar.gz
      darwin-amd64: captain_darwin_amd64.tar.gz
      darwin-arm64: captain_darwin_arm64.tar.gz
    checksum_file: captain_{{.version}}_checksums.txt
    version_command: --version
    version_regex: 'captain version v?(\d+\.\d+\.\d+)'

  golangci-lint:
    name: golangci-lint
    repo: golangci/golangci-lint
    asset_patterns:
      linux-amd64: golangci-lint-{{.version}}-linux-amd64.tar.gz
      linux-arm64: golangci-lint-{{.version}}-linux-arm64.tar.gz
      darwin-amd64: golangci-lint-{{.version}}-darwin-amd64.tar.gz
      darwin-arm64: golangci-lint-{{.version}}-darwin-arm64.tar.gz
    checksum_file: golangci-lint-{{.version}}-checksums.txt
    version_command: --version
    version_regex: 'golangci-lint has version v?(\d+\.\d+\.\d+)'

dependencies:
  task: latest
  golangci-lint: latest
  gavel: latest
  repomap: latest
  captain: latest
