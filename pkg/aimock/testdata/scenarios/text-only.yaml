name: text-only
description: A single-turn reply with no tool use — the smallest scenario that exercises both protocols.

anthropic:
  - match:
      prompt_contains: "capital of France"
    respond:
      text: "The capital of France is Paris."
      stop_reason: end_turn
      usage: {input: 14, output: 8}

openai:
  - match:
      prompt_contains: "capital of France"
    respond:
      text: "The capital of France is Paris."
      finish_reason: stop
      usage: {input: 14, output: 8}
