kind: Fixture
name: Captain disables questions when stderr is redirected or Claude bypasses permissions
defaults:
  timeout: 90s
env:
  CAPTAIN_SESSION_DB_URL: "off"
  CAPTAIN_MONITOR_HOOKS: "off"
  CAPTAIN_DB_CONTEXT: default
  ANTHROPIC_API_KEY: captain-mock
  ANTHROPIC_AUTH_TOKEN: captain-mock
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
steps:
  - id: workspace
    kind: exec
    script: |
      set -eu
      mkdir -p "{{.fixture.dir}}/../../../../.tmp"
      mktemp -d "{{.fixture.dir}}/../../../../.tmp/prompt-questions-terminal-policy.XXXXXX" | tr -d '\n'
    export:
      CASE_DIR: "{{.outputs.stdout}}"
      CAPTAIN_BIN: "{{.fixture.dir}}/../../../../.bin/captain"
    override: true
  - id: stack
    kind: services
    services:
      aimock:
        exec: '"$CAPTAIN_BIN" ai mock --only anthropic --addr 127.0.0.1:{{.port}} --scenario "{{.fixture.dir}}/policy.aimock.yaml" --journal "$CASE_DIR/requests.jsonl"'
        ready: {tcp: "127.0.0.1:{{.port}}"}
  - id: redirected-stderr
    kind: exec
    terminal: pty
    cwd: "{{.env.CASE_DIR}}"
    script: |
      set -eu
      "$CAPTAIN_BIN" prompt run --model agent:haiku --edit --sandbox off --budget 0 --max-tokens 4096 --timeout 45s --no-user --no-project --no-memory --no-skills --no-hooks --no-mcp --json -p 'captain-question-policy-fixture: redirected-stderr' > "$CASE_DIR/stderr-result.json" 2> "$CASE_DIR/stderr.log"
    env:
      ANTHROPIC_BASE_URL: "{{.env.AIMOCK_URL}}"
      CLAUDE_CONFIG_DIR: "{{.env.CASE_DIR}}/claude-stderr"
    cel: exitCode == 0
  - id: bypass
    kind: exec
    terminal: pty
    cwd: "{{.env.CASE_DIR}}"
    script: |
      set -eu
      "$CAPTAIN_BIN" prompt run --model agent:haiku --permission-mode bypassPermissions --sandbox off --budget 0 --max-tokens 4096 --timeout 45s --no-user --no-project --no-memory --no-skills --no-hooks --no-mcp --json -p 'captain-question-policy-fixture: bypass' > "$CASE_DIR/bypass-result.json"
    env:
      ANTHROPIC_BASE_URL: "{{.env.AIMOCK_URL}}"
      CLAUDE_CONFIG_DIR: "{{.env.CASE_DIR}}/claude-bypass"
    cel: exitCode == 0
  - id: policies-reached-model
    kind: exec
    script: |
      jq -s --slurpfile stderrResult "$CASE_DIR/stderr-result.json" --slurpfile bypassResult "$CASE_DIR/bypass-result.json" '
        [.[] | select(.path == "/v1/messages") | .request |
          select(any(.messages[]?; .role == "user" and (.content | contains("captain-question-policy-fixture"))))] as $requests |
        {
          stderrCompleted: ($stderrResult[0].status == "completed" and $stderrResult[0].text == "CAPTAIN_POLICY_COMPLETE"),
          bypassCompleted: ($bypassResult[0].status == "completed" and $bypassResult[0].text == "CAPTAIN_POLICY_COMPLETE"),
          requests: ($requests | length),
          questionsAbsent: all($requests[]; (.toolNames | index("AskUserQuestion")) == null),
          policiesPresent: all($requests[]; .system | contains("Do not ask clarification questions."))
        }
      ' "$CASE_DIR/requests.jsonl"
    cel: json.requests == 2 && json.stderrCompleted && json.bypassCompleted && json.questionsAbsent && json.policiesPresent
